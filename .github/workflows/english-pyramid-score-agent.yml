name: English Pyramid Score Agent

on:
  schedule:
    # GitHub cron is UTC. English kick-offs are Europe/London (GMT/BST).
    # Weekend batches: 12:30 / 15:00 / 17:30 / 19:45 UK → full-time ~14:25–22:45 London.
    - cron: '5,20,35,50 12-22 * * 0,6'
    # Midweek league nights: 19:45 / 20:00 UK → full-time ~21:40–22:45 London.
    - cron: '5,20,35,50 20-22 * * 1-5'
    # Catch-up for delayed lower-league results and slow public score feeds.
    - cron: '30 7-11,23 * * *'
  workflow_dispatch:
    inputs:
      force_agent:
        description: Run the Cursor agent even if no fixture is currently due
        required: false
        type: boolean
        default: false
      skip_sync:
        description: Skip deterministic ESPN ledger sync (agent-only run)
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: english-pyramid-score-agent
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check whether automation is due
        id: due
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_agent }}" == "true" ]]; then
            export ENGLISH_PYRAMID_FORCE_AGENT=1
          fi

          node scripts/english-pyramid-due-fixtures.cjs

      - name: Skip when no fixture should be final yet
        if: steps.due.outputs.due != 'true' && steps.due.outputs.forced != 'true'
        run: echo "No English pyramid automation is due."

      - name: Install dependencies
        if: steps.due.outputs.due == 'true' || steps.due.outputs.forced == 'true'
        run: npm ci

      - name: Sync finished scores from ESPN
        if: (steps.due.outputs.due == 'true' || steps.due.outputs.forced == 'true') && (github.event_name != 'workflow_dispatch' || inputs.skip_sync != true)
        id: sync
        run: npm run english-pyramid:sync

      - name: Commit synced score updates
        if: steps.due.outputs.due == 'true' || steps.due.outputs.forced == 'true'
        id: scores
        run: |
          if git diff --quiet; then
            echo "No score changes to commit."
            echo "scores_changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/data/english-pyramid-fantasy.ts
            git commit -m "$(cat <<'EOF'
Sync English pyramid sweepstake scores from ESPN.

Deterministic ledger append for finished league fixtures on ESPN tiers; NL North/South and matchday sweeps may still need the agent.
EOF
)"
            git push origin HEAD:main
            echo "scores_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate synced scores
        if: steps.due.outputs.due == 'true' || steps.due.outputs.forced == 'true'
        run: npm run english-pyramid:validate:scores

      - name: Build after score sync
        if: steps.scores.outputs.scores_changed == 'true'
        run: npm run build

      - name: Decide whether the Cursor agent should run
        if: steps.due.outputs.due == 'true' || steps.due.outputs.forced == 'true'
        id: agent
        run: |
          needs_agent=false
          if [[ "${{ steps.due.outputs.scan_mode }}" == "matchday" ]]; then
            needs_agent=true
          fi
          if [[ "${{ steps.scores.outputs.scores_changed }}" == "true" ]]; then
            needs_agent=true
          fi
          if [[ -n "${{ steps.sync.outputs.remaining_due }}" && "${{ steps.sync.outputs.remaining_due }}" != "0" ]]; then
            needs_agent=true
          fi
          if [[ "${{ steps.due.outputs.forced }}" == "true" ]]; then
            needs_agent=true
          fi
          echo "needs_agent=${needs_agent}" >> "$GITHUB_OUTPUT"

      - name: Explain missing Cursor API key
        if: steps.agent.outputs.needs_agent == 'true' && env.CURSOR_API_KEY == ''
        run: |
          echo "::warning::CURSOR_API_KEY is not configured."
          echo "ESPN sync may have committed scores; add CURSOR_API_KEY for roast refresh and NL North/South results."

      - name: Install Cursor CLI
        if: steps.agent.outputs.needs_agent == 'true' && env.CURSOR_API_KEY != ''
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor follow-up agent
        if: steps.agent.outputs.needs_agent == 'true' && env.CURSOR_API_KEY != ''
        env:
          DUE_FIXTURES: ${{ steps.due.outputs.fixtures }}
          SCAN_MODE: ${{ steps.due.outputs.scan_mode }}
          UPDATE_DELAY_MINUTES: ${{ steps.due.outputs.update_delay_minutes }}
          DUE_LEAD_MINUTES: ${{ steps.due.outputs.due_lead_minutes }}
          LONDON_CONTEXT: ${{ steps.due.outputs.london_context }}
        run: |
          cat > /tmp/english-pyramid-agent-prompt.txt <<PROMPT
          Update the English pyramid sweepstake for this repository.

          ESPN sync runs automatically before this step — only change ENGLISH_PYRAMID_MANUAL_MATCHES when:
          - scan mode is matchday and reliable UK sources show finished games not yet in the ledger, or
          - a due fixture still has no result after ESPN sync (often NL North/South or delayed feeds).

          Follow .cursor/rules/english-pyramid-sweepstake-manual-updates.mdc exactly:
          - update only app/data/english-pyramid-fantasy.ts
          - append only newly finished league matches with explicit homeRedCards and awayRedCards
          - refresh ENGLISH_PYRAMID_FANTASY_DAILY_UPDATE when the table changes
          - keep roasts varied; British football tone, not American sports-banter
          - run npm run english-pyramid:standings and mirror computed totals in the roast
          - run npm run english-pyramid:validate:scores before finishing

          London context now: ${LONDON_CONTEXT}
          Scan mode: ${SCAN_MODE}
          Trigger detail:
          ${DUE_FIXTURES}

          Expected result check delay is ${UPDATE_DELAY_MINUTES} minutes after kick-off.
          Do not commit, push, create branches, create PRs, or post comments. The workflow handles git operations.
          PROMPT

          agent -p --force "$(cat /tmp/english-pyramid-agent-prompt.txt)" --output-format text

      - name: Validate agent changes
        if: steps.agent.outputs.needs_agent == 'true' && env.CURSOR_API_KEY != ''
        run: |
          npm run english-pyramid:standings
          npm run english-pyramid:validate:scores

      - name: Validate changed files
        if: steps.agent.outputs.needs_agent == 'true' && env.CURSOR_API_KEY != ''
        run: |
          changed_files="$(git diff --name-only)"
          if [[ -z "$changed_files" ]]; then
            echo "No agent changes produced."
            exit 0
          fi

          echo "$changed_files"
          disallowed=""
          while IFS= read -r changed_file; do
            if [[ "$changed_file" != "app/data/english-pyramid-fantasy.ts" ]]; then
              disallowed="${disallowed}${changed_file}"$'\n'
            fi
          done <<< "$changed_files"

          if [[ -n "$disallowed" ]]; then
            echo "::error::The agent changed files outside app/data/english-pyramid-fantasy.ts:"
            echo "$disallowed"
            exit 1
          fi

      - name: Commit and push agent updates
        if: steps.agent.outputs.needs_agent == 'true' && env.CURSOR_API_KEY != ''
        run: |
          if git diff --quiet; then
            echo "No agent changes to commit."
            exit 0
          fi

          git config user.name "cursor-score-agent"
          git config user.email "cursor-score-agent@users.noreply.github.com"
          git add app/data/english-pyramid-fantasy.ts
          git commit -m "Update English pyramid sweepstake scores and roast"
          git push origin HEAD:main
