name: English Pyramid Health Check

on:
  schedule:
    # Self-heal missed syncs, then validate ledger between matchday windows.
    - cron: '30 8,12,16,20,0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: english-pyramid-health-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with latest main
        run: node scripts/ci-pull-main.cjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Self-heal score sync from ESPN
        env:
          ENGLISH_PYRAMID_CI_COMMIT_MESSAGE: |-
            Sync English pyramid sweepstake scores from ESPN (health check).

            Deterministic ledger append for finished fixtures missed by the score agent.
        run: npm run english-pyramid:ci-sync-commit

      - name: Validate English pyramid ledger and ESPN reds
        run: npm run english-pyramid:validate:scores

      - name: Print standings snapshot
        if: always()
        run: npm run english-pyramid:standings
