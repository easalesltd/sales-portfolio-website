name: English Pyramid Health Check

on:
  schedule:
    # Catch overdue fixtures and ledger drift between matchday windows.
    - cron: '30 8,12,16,20,0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-pyramid-health-check
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate English pyramid ledger and ESPN reds
        run: npm run english-pyramid:validate

      - name: Print standings snapshot
        if: always()
        run: npm run english-pyramid:standings
