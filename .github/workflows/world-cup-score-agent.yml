name: World Cup Score Agent

on:
  schedule:
    # The due script waits beyond the normal full-time estimate so stoppage-time
    # goals and public score feeds have settled before an agent records results.
    # Frequent cron slots keep retrying across the full 8-hour lookback for
    # delayed GitHub schedules and slow public score sources.
    - cron: '0,10,20,30,40,50 * * * *'
  workflow_dispatch:
    inputs:
      force_agent:
        description: Run the Cursor agent even if no fixture is currently due
        required: false
        type: boolean
        default: false
      lookback_minutes:
        description: Minutes of expected-final-whistle history to consider
        required: false
        type: string
        default: '480'

permissions:
  contents: write

concurrency:
  group: world-cup-score-agent
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check whether a score update is due
        id: due
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_agent }}" == "true" ]]; then
            export WORLD_CUP_FORCE_AGENT=1
          fi

          export WORLD_CUP_DUE_LOOKBACK_MINUTES="${{ inputs.lookback_minutes || '480' }}"
          node scripts/world-cup-due-fixtures.cjs

      - name: Skip when no fixture should be final yet
        if: steps.due.outputs.due != 'true' && steps.due.outputs.forced != 'true'
        run: echo "No score update is due."

      - name: Explain missing Cursor API key
        if: (steps.due.outputs.due == 'true' || steps.due.outputs.forced == 'true') && env.CURSOR_API_KEY == ''
        run: |
          echo "::warning::CURSOR_API_KEY is not configured, so the scheduled score agent cannot run."
          echo "Add a repository Actions secret named CURSOR_API_KEY to enable automatic score updates."

      - name: Install Cursor CLI for forced smoke test
        if: steps.due.outputs.due != 'true' && steps.due.outputs.forced == 'true' && env.CURSOR_API_KEY != ''
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor credential smoke test
        if: steps.due.outputs.due != 'true' && steps.due.outputs.forced == 'true' && env.CURSOR_API_KEY != ''
        run: |
          agent -p --force "Credential smoke test only. Reply with one short sentence confirming the Cursor agent can run. Do not inspect score websites and do not modify files." --output-format text

      - name: Ensure forced smoke test did not change files
        if: steps.due.outputs.due != 'true' && steps.due.outputs.forced == 'true' && env.CURSOR_API_KEY != ''
        run: |
          if ! git diff --quiet; then
            echo "::error::Forced smoke test changed files unexpectedly."
            git diff --name-only
            exit 1
          fi

          echo "Cursor credential smoke test passed without file changes."

      - name: Install dependencies
        if: steps.due.outputs.due == 'true' && env.CURSOR_API_KEY != ''
        run: npm ci

      - name: Install Cursor CLI
        if: steps.due.outputs.due == 'true' && env.CURSOR_API_KEY != ''
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor score-update agent
        if: steps.due.outputs.due == 'true' && env.CURSOR_API_KEY != ''
        env:
          DUE_FIXTURES: ${{ steps.due.outputs.fixtures }}
          UPDATE_DELAY_MINUTES: ${{ steps.due.outputs.update_delay_minutes }}
          DUE_LEAD_MINUTES: ${{ steps.due.outputs.due_lead_minutes }}
        run: |
          cat > /tmp/world-cup-score-agent-prompt.txt <<PROMPT
          Update the World Cup sweepstake scores for this repository.

          Follow .cursor/rules/world-cup-sweepstake-manual-updates.mdc exactly:
          - update only app/data/world-cup-fantasy.ts
          - append only newly finished matches to WORLD_CUP_FANTASY_MANUAL_MATCHES
          - keep WORLD_CUP_FANTASY_FIXTURES rolling forward
          - refresh WORLD_CUP_FANTASY_DAILY_UPDATE when the table changes
          - keep roasts varied; do not repeat the same premise, phrase, or pub-style gag
          - use final results only, including red-card and second-yellow dismissal tallies
          - only record a score when reliable sources explicitly show it as final/full-time;
            if a source is still live, in progress, or does not clearly say full-time/final,
            leave the fixture unchanged
          - after editing the ledger/roast, run npm run world-cup:standings and make every
            player total, leader/bottom claim, and tie claim in the roast and summary match
            that computed output exactly

          This scheduled run was triggered because the following fixture(s) should be final now,
          or are inside the schedule lead window:
          ${DUE_FIXTURES}

          The expected result check delay is ${UPDATE_DELAY_MINUTES} minutes after kick-off.
          The due checker may run up to ${DUE_LEAD_MINUTES} minutes before that delay to cover
          delayed or skipped GitHub cron slots.
          If a listed fixture is not final in reliable public sources yet, leave it unchanged.
          Do not commit, push, create branches, create PRs, or post comments. The workflow handles git operations.
          PROMPT

          agent -p --force "$(cat /tmp/world-cup-score-agent-prompt.txt)" --output-format text

      - name: Print computed standings
        if: steps.due.outputs.due == 'true' && env.CURSOR_API_KEY != ''
        run: npm run world-cup:standings

      - name: Validate manual World Cup results
        if: steps.due.outputs.due == 'true' && env.CURSOR_API_KEY != ''
        run: npm run world-cup:validate

      - name: Validate changed files
        if: steps.due.outputs.due == 'true' && env.CURSOR_API_KEY != ''
        run: |
          changed_files="$(git diff --name-only)"
          if [[ -z "$changed_files" ]]; then
            echo "No files changed."
            exit 0
          fi

          echo "$changed_files"
          disallowed=""
          while IFS= read -r changed_file; do
            if [[ "$changed_file" != "app/data/world-cup-fantasy.ts" ]]; then
              disallowed="${disallowed}${changed_file}"$'\n'
            fi
          done <<< "$changed_files"

          if [[ -n "$disallowed" ]]; then
            echo "::error::The score agent changed files outside app/data/world-cup-fantasy.ts:"
            echo "$disallowed"
            exit 1
          fi

      - name: Build
        if: steps.due.outputs.due == 'true' && env.CURSOR_API_KEY != ''
        run: |
          if git diff --quiet; then
            echo "No score changes to build."
          else
            npm run build
          fi

      - name: Commit and push score update
        if: steps.due.outputs.due == 'true' && env.CURSOR_API_KEY != ''
        run: |
          if git diff --quiet; then
            echo "No score changes to commit."
            exit 0
          fi

          git config user.name "cursor-score-agent"
          git config user.email "cursor-score-agent@users.noreply.github.com"
          git add app/data/world-cup-fantasy.ts
          git commit -m "Update World Cup sweepstake scores"
          git push origin HEAD:main
