name: World Cup Score Agent

on:
  schedule:
    # Sync ESPN finals first, then refresh the daily roast when standings move.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_agent:
        description: Run the Cursor roast agent even if no fixture is currently due
        required: false
        type: boolean
        default: false
      skip_sync:
        description: Skip deterministic ESPN ledger sync (roast-only run)
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: world-cup-score-agent
  cancel-in-progress: true

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch delayed kick-offs from ESPN
        if: github.event_name == 'schedule'
        run: npm run world-cup:patch-kickoffs

      - name: Commit kick-off patches
        if: github.event_name == 'schedule'
        run: |
          node scripts/lib/ci-git-commit.cjs \
            --paths "app/data/world-cup-fantasy.ts,app/lib/world-cup-knockout-bracket.ts,scripts/lib/world-cup-knockout-bracket.cjs" \
            --message "Patch delayed World Cup kick-off times from ESPN." \
            --output-name kickoff_changed

      - name: Check whether automation is due
        id: due
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_agent }}" == "true" ]]; then
            export WORLD_CUP_FORCE_AGENT=1
          fi

          node scripts/world-cup-due-fixtures.cjs

      - name: Skip when no fixture should be final yet
        if: steps.due.outputs.due != 'true' && steps.due.outputs.forced != 'true'
        run: echo "No World Cup automation is due."

      - name: Install dependencies
        if: steps.due.outputs.due == 'true' || steps.due.outputs.forced == 'true'
        run: npm ci

      - name: Sync finished scores and push to main
        if: (steps.due.outputs.due == 'true' || steps.due.outputs.forced == 'true') && (github.event_name != 'workflow_dispatch' || inputs.skip_sync != true)
        id: scores
        run: |
          git pull --rebase origin main
          npm run world-cup:ci-sync-commit

      - name: Validate synced scores
        if: steps.due.outputs.due == 'true' || steps.due.outputs.forced == 'true'
        run: npm run world-cup:validate:scores

      - name: Build after score sync
        if: steps.scores.outputs.scores_changed == 'true'
        run: npm run build

      - name: Check whether daily roast needs refresh
        if: steps.due.outputs.due == 'true' || steps.due.outputs.forced == 'true'
        id: roast
        run: |
          set +e
          npm run world-cup:validate:roast
          code=$?
          if [[ "$code" -eq 0 ]]; then
            echo "needs_roast=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_roast=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Explain missing Cursor API key for roast refresh
        if: steps.roast.outputs.needs_roast == 'true' && env.CURSOR_API_KEY == ''
        run: |
          echo "::warning::Daily roast is stale but CURSOR_API_KEY is not configured."
          echo "Scores were synced if ESPN had finals; add CURSOR_API_KEY to enable automatic roast refresh."

      - name: Install Cursor CLI
        if: steps.roast.outputs.needs_roast == 'true' && env.CURSOR_API_KEY != ''
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run Cursor roast-update agent
        if: steps.roast.outputs.needs_roast == 'true' && env.CURSOR_API_KEY != ''
        env:
          DUE_FIXTURES: ${{ steps.due.outputs.fixtures }}
        run: |
          cat > /tmp/world-cup-roast-agent-prompt.txt <<PROMPT
          Refresh the World Cup sweepstake daily roast for this repository.

          Scores are synced automatically from ESPN — do not append or change WORLD_CUP_FANTASY_MANUAL_MATCHES
          unless validate:scores is failing and you are fixing a specific ledger error.

          Follow .cursor/rules/world-cup-sweepstake-manual-updates.mdc for roast rules:
          - update only WORLD_CUP_FANTASY_DAILY_UPDATE in app/data/world-cup-fantasy.ts
          - run npm run world-cup:standings and mirror computed totals exactly
          - run npm run world-cup:validate:roast before finishing; fix any roast validation errors
          - keep roasts varied; do not repeat the same premise, phrase, or pub-style gag
          - frame knockouts as survival football with eliminations and teams left alive

          Recent fixtures that may need covering in the roast:
          ${DUE_FIXTURES}

          Do not commit, push, create branches, create PRs, or post comments. The workflow handles git operations.
          PROMPT

          agent -p --force "$(cat /tmp/world-cup-roast-agent-prompt.txt)" --output-format text

      - name: Validate roast update
        if: steps.roast.outputs.needs_roast == 'true' && env.CURSOR_API_KEY != ''
        run: |
          npm run world-cup:standings
          npm run world-cup:validate:roast

      - name: Validate changed roast files
        if: steps.roast.outputs.needs_roast == 'true' && env.CURSOR_API_KEY != ''
        run: |
          changed_files="$(git diff --name-only)"
          if [[ -z "$changed_files" ]]; then
            echo "No roast changes produced."
            exit 0
          fi

          echo "$changed_files"
          disallowed=""
          while IFS= read -r changed_file; do
            if [[ "$changed_file" != "app/data/world-cup-fantasy.ts" ]]; then
              disallowed="${disallowed}${changed_file}"$'\n'
            fi
          done <<< "$changed_files"

          if [[ -n "$disallowed" ]]; then
            echo "::error::The roast agent changed files outside app/data/world-cup-fantasy.ts:"
            echo "$disallowed"
            exit 1
          fi

      - name: Commit and push roast update
        if: steps.roast.outputs.needs_roast == 'true' && env.CURSOR_API_KEY != ''
        env:
          CI_GIT_USER_NAME: cursor-score-agent
          CI_GIT_USER_EMAIL: cursor-score-agent@users.noreply.github.com
        run: |
          node scripts/lib/ci-git-commit.cjs \
            --paths "app/data/world-cup-fantasy.ts" \
            --message "Update World Cup daily roast" \
            --output-name roast_changed
