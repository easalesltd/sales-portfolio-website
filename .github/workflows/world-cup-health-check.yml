name: World Cup Health Check

on:
  schedule:
    # Always-on validation catches overdue fixtures and stale roasts even when cron bunches up.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-cup-health-check
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate World Cup ledger, ESPN reds, and daily roast
        run: npm run world-cup:validate

      - name: Print standings snapshot
        if: always()
        run: npm run world-cup:standings
