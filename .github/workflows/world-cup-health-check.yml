name: World Cup Health Check

on:
  schedule:
    # Self-heal missed syncs, then validate ledger. Roast staleness is a warning only.
    # Check every hour, but only run during match windows
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-cup-health-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check if in match window
        id: match_window
        run: node scripts/world-cup-match-window-check.cjs

      - name: Skip when outside match window
        if: steps.match_window.outputs.should_run != 'true'
        run: echo "Outside match window - skipping health check to save CI resources."

      - name: Sync with latest main
        if: steps.match_window.outputs.should_run == 'true'
        run: node scripts/ci-pull-main.cjs

      - name: Setup Node
        if: steps.match_window.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.match_window.outputs.should_run == 'true'
        run: npm ci

      - name: Self-heal score sync from ESPN
        if: steps.match_window.outputs.should_run == 'true'
        env:
          WORLD_CUP_CI_COMMIT_MESSAGE: |-
            Sync World Cup sweepstake scores from ESPN (health check).

            Deterministic ledger append for finished fixtures missed by the score agent.
        run: npm run world-cup:ci-sync-commit

      - name: Validate World Cup ledger and ESPN reds
        if: steps.match_window.outputs.should_run == 'true'
        run: npm run world-cup:validate:scores

      - name: Check daily roast freshness
        if: steps.match_window.outputs.should_run == 'true'
        run: |
          set +e
          npm run world-cup:validate:roast
          code=$?
          if [[ "$code" -ne 0 ]]; then
            echo "::warning::World Cup daily roast is stale; the score agent should refresh it."
          fi
          exit 0

      - name: Print standings snapshot
        if: steps.match_window.outputs.should_run == 'true' && always()
        run: npm run world-cup:standings
