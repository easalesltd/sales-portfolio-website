name: World Cup Health Check

on:
  schedule:
    # Self-heal missed syncs, then validate ledger and roast.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-cup-health-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync finished scores from ESPN
        run: npm run world-cup:sync

      - name: Commit synced score updates
        id: scores
        run: |
          if git diff --quiet; then
            echo "No score changes to commit."
            echo "scores_changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              app/data/world-cup-fantasy.ts \
              app/lib/world-cup-knockout-bracket.ts \
              scripts/lib/world-cup-knockout-bracket.cjs
            git commit -m "$(cat <<'EOF'
Sync World Cup sweepstake scores from ESPN (health check).

Deterministic ledger append for finished fixtures missed by the score agent.
EOF
)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "scores_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate World Cup ledger, ESPN reds, and daily roast
        run: npm run world-cup:validate

      - name: Print standings snapshot
        if: always()
        run: npm run world-cup:standings
