<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Mini Chocolate Christmas Puddings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#3f1d5a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="220" cy="220" r="240" fill="url(#accent)" opacity="0.28"/>
  <circle cx="980" cy="620" r="320" fill="url(#accent)" opacity="0.22"/>

  <g fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" text-anchor="middle">
    <text x="600" y="320" font-size="72" font-weight="800">CHOCOLATE</text>
    <text x="600" y="440" font-size="56" font-weight="700">Mini Chocolate Christmas Puddings</text>
    <text x="600" y="500" font-size="28" opacity="0.85">Replace this placeholder with your photo</text>
    <text x="600" y="560" font-size="22" opacity="0.7">/public/images/recipes/mini-chocolate-puddings-v2.svg</text>
  </g>
</svg>
