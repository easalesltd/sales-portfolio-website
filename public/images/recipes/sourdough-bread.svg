<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Sourdough Bread">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="980" cy="180" r="220" fill="url(#accent)" opacity="0.25"/>
  <circle cx="220" cy="640" r="300" fill="url(#accent)" opacity="0.18"/>

  <g fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" text-anchor="middle">
    <text x="600" y="320" font-size="120"><^</text>
    <text x="600" y="440" font-size="64" font-weight="700">Sourdough Bread</text>
    <text x="600" y="500" font-size="28" opacity="0.85">Replace this placeholder with your photo</text>
    <text x="600" y="560" font-size="22" opacity="0.7">/public/images/recipes/sourdough-bread.svg</text>
  </g>
</svg>
